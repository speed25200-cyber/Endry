# Relais vers l'API Codemagic : état des builds et journaux d'erreur, lisibles dans les logs de ce job.
# Se déclenche quand .github/codemagic/demande.json change, ou à la main.
name: Codemagic (relais)
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/codemagic/demande.json"
permissions:
  contents: write
jobs:
  relais:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Interroger Codemagic
        env:
          CM_JETON: ${{ secrets.CODEMAGIC_API_TOKEN || secrets.CODEMAGIC_TOKEN || secrets.CM_API_TOKEN || secrets.CODEMAGIC_API_KEY || secrets.CODEMAGIC }}
        run: |
          pip install -q pillow
          python3 .github/codemagic/relais.py
      - name: Publier les captures (branche captures-ci)
        if: always()
        run: |
          [ -d captures-out ] && [ -n "$(ls -A captures-out)" ] || exit 0
          cd captures-out
          git init -q -b captures-ci
          git config user.name "relais-codemagic"
          git config user.email "relais@users.noreply.github.com"
          git add -A && git commit -qm "Captures du build $(cat BUILD.txt)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" captures-ci

<sc-if value="{{o.bureau}}" hint-placeholder-val="{{ false }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="3"></circle><circle cx="12" cy="12" r="8"></circle></svg></sc-if>

<script type="text/x-dc" data-dc-script data-props='{"sombre":{"editor":"boolean","default":true,"section":"Thème"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { onglet: 0, lx: null, lw: null, x: 0, glisse: false, idx: 0, change: false, t: 0 };
this.largeur = 358 - 32;
this.course = this.largeur - 44;
this.slot = (358 - 12) / 5;
this.decisions = [
['Créer l’offre adoucisseur pour Mme Gander', 'Glisser pour valider'],
['Réponse à Mme Rey — variante WC', 'Glisser pour envoyer'],
['Facture RE-00990 à la Régie Dubois', 'Glisser pour envoyer'],
['Commande de robinetterie — Villa Morel', 'Glisser pour valider']
];
}
componentDidMount() {
const depart = performance.now();
const pas = (m) => {
const t = Math.min(1, (m - depart - 300) / 1600);
this.setState({ t: Math.max(0, t) });
if (t < 1) this.anim = requestAnimationFrame(pas);
};
this.anim = requestAnimationFrame(pas);
}
componentWillUnmount() { cancelAnimationFrame(this.anim); clearTimeout(this.m1); clearTimeout(this.m2); }
lentille(i) { return { x: 6 + i * this.slot + 3, w: this.slot - 6 }; }
position(e) {
const r = e.currentTarget.getBoundingClientRect();
return (e.clientX - r.left) / (r.width / this.largeur) - 22;
}
renderVals() {
const sombre = this.props.sombre ?? true;
const theme = sombre
? '--fond:#0D0C0A;--surface:rgba(255,255,255,.045);--verre:rgba(255,255,255,.06);--encre:#ECE7DF;--doux:#958D81;--filet:rgba(236,231,223,.1);--filet-fort:rgba(236,231,223,.28);--reflet:rgba(255,255,255,.16);--signal:#E7C88F;--signal-halo:rgba(231,200,143,.16);--vert:#8FD1A0;--lentille:rgba(255,255,255,.08);--rgb-ombre:0,0,0;--ambiance:.38;--orbe-a:#FFFFFF;--orbe-b:rgba(236,231,223,.42);--orbe-c:rgba(236,231,223,.06)'
: '--fond:#F2F0EB;--surface:rgba(255,255,255,.62);--verre:rgba(255,255,255,.55);--encre:#141210;--doux:#6B655C;--filet:rgba(20,18,16,.09);--filet-fort:rgba(20,18,16,.26);--reflet:rgba(255,255,255,1);--signal:#9A6E2C;--signal-halo:rgba(154,110,44,.14);--vert:#2F7A47;--lentille:rgba(20,18,16,.06);--rgb-ombre:20,18,16;--ambiance:.22;--orbe-a:#FFFFFF;--orbe-b:rgba(20,18,16,.18);--orbe-c:rgba(20,18,16,.5)';
const s = this.state;
const e = 1 - Math.pow(1 - s.t, 4);
const n = this.decisions.length;
const d = this.decisions[s.idx % n];
const cible = this.lentille(s.onglet);
const noms = [['Accueil', 'accueil'], ['Chantiers', 'chantiers'], ['', 'orbe'], ['Finances', 'finances'], ['Bureau', 'bureau']];
const onglets = noms.map(([nom, cle], i) => ({
nom, orbe: cle === 'orbe', onglet: cle !== 'orbe',
accueil: cle === 'accueil', chantiers: cle === 'chantiers', finances: cle === 'finances', bureau: cle === 'bureau',
couleur: s.onglet === i ? 'var(--encre)' : 'var(--doux)',
choisir: () => {
if (i === this.state.onglet) return;
const a = this.lentille(this.state.onglet), b = this.lentille(i);
const g = Math.min(a.x, b.x);
this.setState({ onglet: i, lx: g, lw: Math.max(a.x, b.x) + b.w - g });
clearTimeout(this.m2);
this.m2 = setTimeout(() => this.setState({ lx: null, lw: null }), 170);
}
}));
const graduations = Array.from({ length: 14 }, (_, i) => ({ h: i % 3 === 0 ? 9 : 5, m: i % 3 === 0 ? 0 : 2 }));
const pos = 350 * ((9 + 41 / 60 - 6) / 14);
const x = Math.max(0, Math.min(this.course, s.x));
return {
theme, onglets, graduations,
maintenant: pos.toFixed(1),
maintenantPoint: (pos - 3).toFixed(1),
titre: d[0], geste: d[1],
restantes: String(Math.round((n - s.idx % n) * e)).padStart(2, '0'),
montant: Math.round(2387 * e).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '’'),
courbe: (200 * (1 - e)).toFixed(1),
lentilleX: s.lx ?? cible.x,
lentilleL: s.lw ?? cible.w,
curseurX: x,
echelle: s.glisse ? 1.08 : 1,
trait: x,
carteOpacite: s.change ? 0 : 1,
transition: s.glisse ? 'transform .18s ease' : 'transform .75s cubic-bezier(.34,1.45,.5,1), width .75s cubic-bezier(.34,1.45,.5,1)',
texteOpacite: Math.max(0, 1 - x / 110),
debut: (ev) => { ev.currentTarget.setPointerCapture && ev.currentTarget.setPointerCapture(ev.pointerId); this.setState({ glisse: true, x: this.position(ev) }); },
bouge: (ev) => { if (this.state.glisse) this.setState({ x: this.position(ev) }); },
fin: () => {
if (!this.state.glisse) return;
if (this.state.x >= this.course * 0.9) {
this.setState({ glisse: false, x: this.course, change: true });
clearTimeout(this.m1);
this.m1 = setTimeout(() => this.setState({ change: false, x: 0, idx: this.state.idx + 1 }), 480);
} else this.setState({ glisse: false, x: 0 });
}
};
}
}
</script>

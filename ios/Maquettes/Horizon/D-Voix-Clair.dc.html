<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Voix — Horizon clair</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:var(--encre)}a:hover{opacity:.7}
@keyframes fondu{from{opacity:0}to{opacity:1}}
@keyframes veille{0%,100%{opacity:1}50%{opacity:.35}}
.fondu{animation:fondu 1.4s cubic-bezier(.16,1,.3,1) both}
.veille{animation:veille 2.8s ease-in-out infinite}
.verre{background:var(--verre);backdrop-filter:blur(26px) saturate(160%);-webkit-backdrop-filter:blur(26px) saturate(160%);box-shadow:inset 0 0 0 .5px var(--filet),inset 1px 1px 0 var(--reflet),0 18px 40px -16px rgba(var(--rgb-ombre),.55)}
.mono{font-family:'Geist Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase}
</style>
</helmet>
<div style="{{theme}}; width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--fond); font-family: 'Geist', -apple-system, system-ui, sans-serif; color: var(--encre)">

<img src="/_blob/c2d64d2d3e07e6286a86c3ea44f387fb" alt="" style="position: absolute; left: -60px; top: 80px; width: 510px; height: 520px; object-fit: cover; filter: blur(80px) saturate(1.3); opacity: var(--ambiance); pointer-events: none">

<div class="fondu" style="position: absolute; left: 16px; right: 16px; top: 56px; display: flex; align-items: center; justify-content: space-between">
<div class="verre" style="height: 40px; padding: 0 14px 0 12px; border-radius: 20px; display: flex; align-items: center; gap: 8px">
<span class="veille" style="width: 6px; height: 6px; border-radius: 3px; background: var(--vert)"></span>
<span class="mono" style="font-size: 10px">Relais direct · bureau</span>
</div>
<button class="verre" aria-label="Fermer" style="width: 40px; height: 40px; border: 0; border-radius: 20px; color: var(--encre); display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</button>
</div>

<div style="position: absolute; left: 45px; top: 150px; width: 300px; height: 300px">
<div style="position: absolute; left: 60px; top: 60px; width: 180px; height: 180px; border-radius: 90px; box-shadow: inset 0 0 0 .5px var(--filet-fort)"></div>
<sc-for list="{{traits}}" as="r" hint-placeholder-count="96">
<span style="position: absolute; left: 149.5px; top: 150px; width: 1px; height: {{r.h}}px; background: var(--encre); opacity: {{r.o}}; transform-origin: 50% 0; transform: rotate({{r.a}}deg) translateY(96px)"></span>
</sc-for>
<div style="position: absolute; left: 0; right: 0; top: 128px; text-align: center">
<div style="font-family: 'Geist', sans-serif; font-weight: 300; font-size: 34px; letter-spacing: -1.5px; font-variant-numeric: tabular-nums">0:{{secondes}}</div>
<div class="mono" style="font-size: 9px; color: var(--doux); margin-top: 2px">Écoute</div>
</div>
</div>

<div style="position: absolute; left: 20px; right: 20px; top: 500px">
<div class="mono fondu" style="display: flex; justify-content: space-between; color: var(--doux)"><span>Transcription</span><span>fr-CH</span></div>
<div style="height: .5px; background: var(--filet-fort); margin: 10px 0 14px 0"></div>
<p style="margin: 0; font-size: 26px; font-weight: 300; line-height: 1.22; letter-spacing: -.6px; text-wrap: pretty">
<sc-for list="{{mots}}" as="m" hint-placeholder-count="12">
<span style="opacity: {{m.o}}; transition: opacity .5s ease">{{m.t}} </span>
</sc-for>
</p>
</div>

<div class="mono fondu" style="position: absolute; left: 20px; right: 20px; top: 702px; color: var(--doux); display: flex; justify-content: space-between"><span>Transmis mot pour mot</span><span>Réponse lue ici</span></div>

<div class="fondu" style="position: absolute; left: 16px; right: 16px; bottom: 26px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<button class="verre" aria-label="Écrire" style="height: 56px; border: 0; border-radius: 28px; color: var(--encre); display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="6" width="18" height="12" rx="3"></rect><path d="M7 14h10"></path></svg>
</button>
<button class="verre mono" style="grid-column: span 2; height: 56px; border: 0; border-radius: 28px; color: var(--encre); cursor: pointer">Envoyer</button>
<button class="verre" aria-label="Conversation" style="height: 56px; border: 0; border-radius: 28px; color: var(--encre); display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M5 5h14v10H9l-4 4z"></path></svg>
</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sombre":{"editor":"boolean","default":false,"section":"Thème"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { t: 0 }; }
componentDidMount() {
const depart = performance.now();
const pas = (m) => { this.setState({ t: (m - depart) / 1000 }); this.anim = requestAnimationFrame(pas); };
this.anim = requestAnimationFrame(pas);
}
componentWillUnmount() { cancelAnimationFrame(this.anim); }
renderVals() {
const sombre = this.props.sombre ?? false;
const theme = sombre
? '--fond:#0D0C0A;--verre:rgba(255,255,255,.06);--encre:#ECE7DF;--doux:#958D81;--filet:rgba(236,231,223,.1);--filet-fort:rgba(236,231,223,.28);--reflet:rgba(255,255,255,.16);--vert:#8FD1A0;--rgb-ombre:0,0,0;--ambiance:.32'
: '--fond:#F2F0EB;--verre:rgba(255,255,255,.55);--encre:#141210;--doux:#6B655C;--filet:rgba(20,18,16,.09);--filet-fort:rgba(20,18,16,.26);--reflet:rgba(255,255,255,1);--vert:#2F7A47;--rgb-ombre:20,18,16;--ambiance:.2';
const t = this.state.t;
const traits = Array.from({ length: 96 }, (_, i) => {
const a = i * 3.75;
const r = a * Math.PI / 180;
const v = 0.5 + 0.5 * Math.sin(t * 4.3 + r * 3) * Math.cos(t * 1.7 + r * 5) + 0.25 * Math.sin(t * 9 + i * 0.7);
const h = 4 + Math.max(0, v) * 34;
return { a: (a + 180).toFixed(2), h: h.toFixed(1), o: (0.35 + Math.min(1, v) * 0.65).toFixed(2) };
});
const texte = 'Sur l’offre Lambert, enlève la main-d’œuvre du groupe de sécurité.'.split(' ');
const allumes = Math.floor(Math.max(0, t - 0.8) / 0.3);
const mots = texte.map((m, i) => ({ t: m, o: i < allumes ? 1 : 0.22 }));
return { theme, traits, mots, secondes: String(Math.floor(t) % 60).padStart(2, '0') };
}
}
</script>
</body>
</html>

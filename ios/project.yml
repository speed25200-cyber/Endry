# Projet Xcode généré par XcodeGen (https://github.com/yonaskolb/XcodeGen).
#   brew install xcodegen && cd ios && xcodegen generate && open EndryPilotage.xcodeproj
# Le fichier .xcodeproj n'est pas versionné : ce fichier fait foi.
name: EndryPilotage

options:
  bundleIdPrefix: ch.endry
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: fr
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

packages:
  EndryKit:
    path: EndryKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  EndryPilotage:
    type: application
    platform: iOS
    sources:
      - path: EndryPilotage
        excludes:
          - "**/*.md"
    dependencies:
      - package: EndryKit
      - target: EndryWidget
        embed: true
    entitlements:
      path: EndryPilotage/EndryPilotage.entitlements
      properties:
        aps-environment: development
        keychain-access-groups:
          - $(AppIdentifierPrefix)ch.endry.pilotage
        com.apple.security.application-groups:
          - group.ch.endry.pilotage
    info:
      path: EndryPilotage/Info.plist
      properties:
        CFBundleDisplayName: Endry
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations: [fr]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.business
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: FondLancement
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIAppFonts:
          - InterTight-Medium.ttf
          - InterTight-SemiBold.ttf
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
        CFBundleURLTypes:
          - CFBundleURLName: ch.endry.pilotage
            CFBundleURLSchemes: [endrypilotage]
        NSAppTransportSecurity:
          # Réseau privé Tailscale (http://100.x.y.z:8080) : connexions locales autorisées, rien d'autre.
          NSAllowsLocalNetworking: true
        NSMicrophoneUsageDescription: "Le micro sert à dicter vos consignes et vos saisies de chantier."
        NSSpeechRecognitionUsageDescription: "La reconnaissance vocale transforme votre dictée en texte, sur l’iPhone lorsque c’est possible."
        NSCameraUsageDescription: "L’appareil photo sert à scanner des bons, des factures et des QR codes d’accès."
        NSPhotoLibraryUsageDescription: "Vos photos de chantier peuvent être jointes à une saisie."
        NSFaceIDUsageDescription: "Face ID protège l’accès aux données de l’entreprise."
        EndryPrefixeEquipe: $(AppIdentifierPrefix)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.endry.pilotage
        PRODUCT_NAME: EndryPilotage
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: EndryPilotage/Info.plist

  EndryWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: EndryWidget
      - path: EndryPilotage/Design/Palette.swift
      - path: EndryPilotage/Design/Typographie.swift
      - path: EndryPilotage/Design/MontantView.swift
      - path: EndryPilotage/Services/Configuration.swift
      - path: EndryPilotage/Ressources/Polices
        buildPhase: resources
    dependencies:
      - package: EndryKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: EndryWidget/EndryWidget.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)ch.endry.pilotage
        com.apple.security.application-groups:
          - group.ch.endry.pilotage
    info:
      path: EndryWidget/Info.plist
      properties:
        CFBundleDisplayName: Endry
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - InterTight-Medium.ttf
          - InterTight-SemiBold.ttf
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
        EndryPrefixeEquipe: $(AppIdentifierPrefix)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.endry.pilotage.widget
        PRODUCT_NAME: EndryWidget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: EndryWidget/Info.plist
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  EndryPilotageTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/EndryPilotageTests
    dependencies:
      # EndryKit est déjà lié dans l'app hôte (TEST_HOST) : ne pas le lier une seconde fois.
      - target: EndryPilotage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.endry.pilotage.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/EndryPilotage.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/EndryPilotage
        BUNDLE_LOADER: $(TEST_HOST)

  EndryPilotageUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/EndryPilotageUITests
    dependencies:
      - target: EndryPilotage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.endry.pilotage.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: EndryPilotage

schemes:
  EndryPilotage:
    build:
      targets:
        EndryPilotage: all
        EndryWidget: all
    run:
      config: Debug
      commandLineArguments:
        "-demo": false
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: EndryPilotageTests
        - name: EndryPilotageUITests
    archive:
      config: Release
